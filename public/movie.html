<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Просмотр - Kinoproba</title>
<link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/library.css">
</head>
<body><div class="wrapper">
<header class="container">
  <a href="index.html" class="logo">KINOPROBA</a>
  <nav><ul>
    <li><a href="index.html">Главная</a></li>
    <li><a href="library.html">Библиотека</a></li>
    <li><a href="movies.html">Фильмы</a></li>
    <li><a href="series.html">Сериалы</a></li>
    <li><a href="community.html">Подборки</a></li>
    <li><a href="spaces.html">Каталоги</a></li>
    <li><a href="profile.html" id="me">Вход</a></li>
    <li class="btn"><a href="contacts.html">Контакты</a></li>
  </ul></nav>
  <div class="header-extra"></div>
</header>

<main class="container movie-page">
  <div class="movie-poster"><img id="img" src="https://via.placeholder.com/300x450?text=..." alt="Постер"></div>
  <div class="movie-info">
    <h1 id="title">Загрузка…</h1>
    <div class="movie-meta"><span id="year"></span> — <span id="genre"></span></div>
    <div class="rates" id="rates"></div>
    <p id="desc"></p>

    <div class="ctl" id="ctl"></div>
    <div class="eps-box" id="eps"></div>
    <div id="rvMine"></div>

    <div class="tabs">
      <button class="b on" data-tab="trailer">Трейлер</button>
      <button class="b" data-tab="file">Файл с устройства</button>
      <button class="b" data-tab="full">Полная версия</button>
      <button class="b" data-tab="link">Своя ссылка</button>
    </div>
    <div class="ep-now" id="epNow"></div>
    <div class="player" id="player"></div>
    <div class="own" id="own"></div>
    <div class="rv-others" id="rvOthers"></div>
  </div>
</main></div>

<script src="js/app.js"></script>
<script>
const $ = s => document.querySelector(s), e = KP.esc, P = new URLSearchParams(location.search);
KP.nav();
let item = KP.load().find(i => i.id === P.get('lib')) || null;
let tm = P.get('id') || (item && item.tmdb) || null, type = P.get('t') || (item && item.type === 'tv' ? 'tv' : 'movie'), info = null;
let kpi = null, kpP = Promise.resolve(); // kpi — данные Кинопоиска (рейтинги, «где смотреть»), kpP — их загрузка

async function init() {
  if (P.get('imdb') && !tm) { try { const f = await KP.tmdb('/find/' + P.get('imdb'), '&external_source=imdb_id'); const r = f.movie_results[0] || f.tv_results[0]; if (r) { tm = r.id; type = f.movie_results[0] ? 'movie' : 'tv'; } } catch (err) {} }
  if (item && !tm) { info = item; fill(item); }
  if (tm) {
    try { info = await KP.fromTmdb(tm, type); fill(info); }
    catch (err) { if (!item) { $('#title').textContent = 'Не удалось загрузить фильм (' + err.message + ').'; $('#desc').innerHTML = 'Причину покажет <a href="check.html" style="color:#ffb3b3">страница диагностики</a>.'; } else fill(item); }
  }
  if (!item && info) item = KP.inLib(tm, type) || KP.find(KP.load(), info.title, info.year) || null;
  if (item && item.type === 'tv' && tm && info && info.seasons && info.seasons.length) { // у идущих сериалов подтягиваем новые сезоны и серии из TMDB
    const n = KP.syncTmdbSeasons(item.id, info.seasons); item = KP.load().find(x => x.id === item.id) || item;
    if (n) epNote = 'Из TMDB добавлено серий: ' + n;
  }
  controls(); mine(); kpP = loadKp(); kpP.then(others);
  tab(type === 'tv' ? (epUrl(epCur()) ? 'link' : 'trailer') : item && item.source === 'stream' && item.url ? 'link' : 'trailer');
}
// Кинопоиск дополняет TMDB: рейтинги, ссылка, «где смотреть»; если он недоступен, страница работает как раньше
async function loadKp() {
  const src = info || item; if (!src) return;
  try { kpi = src.kpId ? await KP.kp('/movie/' + src.kpId) : await KP.kpMatch(src); } catch (err) { kpi = null; }
  if (!kpi) return;
  info = KP.mergeKp(src, kpi); fill(info);
  if (item && (item.kpId !== kpi.kp || item.ratingKp !== kpi.ratingKp || item.ratingImdb !== kpi.ratingImdb)) { // запоминаем в библиотеке
    const d = { kpId: kpi.kp, kpUrl: kpi.url, ratingKp: kpi.ratingKp, ratingImdb: kpi.ratingImdb }; Object.assign(item, d); const l = KP.load(), x = l.find(i => i.id === item.id); if (x) { Object.assign(x, d); KP.save(l); } // без смены «upd», чтобы не сбрасывать напоминания
  }
}
function fill(m) {
  document.title = m.title + ' - Kinoproba';
  $('#title').textContent = m.title; $('#year').textContent = m.year || '----';
  $('#genre').textContent = (m.genres || []).join(', ') || KP.TY[m.type] || '';
  document.querySelectorAll('.movie-meta .lk').forEach(a => a.remove()); // ссылка вместе с разделителем; fill() вызывается повторно, когда приходят данные Кинопоиска
  const lk = (u, n) => `<span class="lk"> — <a href="${e(u)}" target="_blank" rel="noopener" style="color:#fff">${n}</a></span>`;
  if (m.imdb) document.querySelector('.movie-meta').insertAdjacentHTML('beforeend', lk(`https://www.imdb.com/title/${m.imdb}/`, 'IMDb'));
  if (m.kpUrl) document.querySelector('.movie-meta').insertAdjacentHTML('beforeend', lk(m.kpUrl, 'Кинопоиск'));
  $('#rates').innerHTML = [m.ratingKp ? `<span class="rt"><b>${e(m.ratingKp)}</b> Кинопоиск</span>` : '', m.ratingImdb ? `<span class="rt"><b>${e(m.ratingImdb)}</b> IMDb</span>` : ''].join('');
  $('#desc').textContent = m.overview || 'Описание отсутствует.';
  if (m.poster) $('#img').src = m.poster;
}
// статус и оценка прямо на странице фильма
function controls() {
  const c = $('#ctl');
  if (!item) { c.innerHTML = '<button class="b" id="add">+ В библиотеку</button>'; $('#add').onclick = () => { item = KP.add(info).item || KP.find(KP.load(), info.title, info.year); controls(); mine(); }; eps(); return; }
  c.innerHTML = `<select id="st">${Object.entries(KP.ST).map(([k, v]) => `<option value="${k}" ${k === item.status ? 'selected' : ''}>${v}</option>`).join('')}</select>
    <span class="stars">${[1, 2, 3, 4, 5].map(n => `<span data-n="${n}" class="${n <= item.rating ? 'on' : ''}">★</span>`).join('')}</span>
    <a class="b g" href="library.html">В библиотеку</a>`;
  $('#st').onchange = ev => { KP.update(item.id, { status: ev.target.value }); item.status = ev.target.value; };
  c.querySelector('.stars').onclick = ev => { const n = +ev.target.dataset.n; if (!n) return; item.rating = item.rating === n ? 0 : n; KP.update(item.id, { rating: item.rating }); controls(); };
  eps();
}
// моя рецензия: пишется и правится прямо здесь, без открытия редактора всей карточки
function mine() {
  const box = $('#rvMine'), chg = () => { item = KP.load().find(x => x.id === item.id) || item; others(); };
  if (item) return KP.rvMine(box, item.id, { change: chg });
  box.innerHTML = '<div class="rv-empty"><span>Рецензию можно написать после добавления фильма в библиотеку.</span><button type="button" class="b" id="rvAdd">✎ Написать рецензию</button></div>';
  $('#rvAdd').onclick = () => {
    if (!info) return;
    item = KP.add(info).item || KP.find(KP.load(), info.title, info.year); if (!item) return;
    controls(); KP.rvMine(box, item.id, { edit: true, change: chg });
  };
}
// рецензии других пользователей: видны только те, что автор сам открыл («Показывать другим»)
async function others() {
  const box = $('#rvOthers'), s = info || item; if (!s) return;
  try {
    const r = await KP.api('/reviews?' + new URLSearchParams({ tmdb: s.tmdb || '', type: s.type || '', imdb: s.imdb || '', kp: s.kpId || '', title: s.title || '', year: s.year || '' }));
    const list = r.filter(x => !KP.user || x.user !== KP.user.username);
    box.innerHTML = `<h2>Рецензии пользователей${list.length ? ' (' + list.length + ')' : ''}</h2>` + (list.map(x => KP.rvView(x, x.user)).join('') || '<p class="rv-none">Других рецензий на этот фильм пока нет.</p>');
  } catch (err) { box.innerHTML = ''; }
}
// сериал: сезоны и серии с названиями из TMDB; отметки лежат в карточке библиотеки (поле w), так же как в окне «Серии» на странице библиотеки.
// Серии можно добавлять и убирать здесь же («Добавить или убрать серии»): нужно для идущих сериалов, ручных карточек и сериалов без данных TMDB
let epSeason = 0, edOpen = false, epNote = ''; const epCache = {};
const box = $('#eps');
// просмотр серии: файл с устройства или ссылка — как у фильма, но отдельно для каждой серии.
// Ссылки лежат в карточке (eu = { 'S1E3': 'https://…' }) и сохраняются вместе с библиотекой. Файл с устройства на сервер не загружается (как у фильмов):
// он запоминается для серии до перезагрузки страницы (epFile), дальше его нужно выбрать снова
let curEp = '', curTab = 'trailer', epEnded = false; const epFile = {};
const isTv = () => type === 'tv';
const epAll = () => ((item && item.seasons && item.seasons.length ? item.seasons : info && info.seasons) || []).flatMap(s => KP.epCodes(s));
const epCur = () => { const all = epAll(); if (curEp && all.includes(curEp)) return curEp; const w = (item && item.w) || []; return all.find(c => !w.includes(c)) || all[0] || ''; }; // не выбрана серия — берём первую непросмотренную
const epUrl = c => (item && item.eu && item.eu[c]) || '';
const epNum = c => c.match(/\d+/g).map(Number);
function epLabel(c) { const [s, k] = epNum(c), ep = (epCache[s] || [])[k - 1]; return `Сезон ${s}, серия ${k}` + (ep && ep.name ? ' — ' + ep.name : ''); }
function bar() { // строка «‹ серия ›» над плеером: только для сериала и только на вкладках «Файл» и «Своя ссылка»
  const c = isTv() && (curTab === 'file' || curTab === 'link') ? epCur() : '', all = epAll(), k = all.indexOf(c);
  $('#epNow').innerHTML = !c ? '' : `<button type="button" class="b g" data-step="-1" ${k > 0 ? '' : 'disabled'} title="Предыдущая серия">‹</button>
    <span class="ep-t"><b>${e(epLabel(c))}</b>${epUrl(c) ? '<small>🔗 ссылка сохранена</small>' : ''}${epFile[c] ? `<small>📁 ${e(epFile[c].name)}</small>` : ''}</span>
    <button type="button" class="b ${epEnded ? '' : 'g'}" data-step="1" ${k < all.length - 1 ? '' : 'disabled'} title="Следующая серия">${epEnded ? 'Следующая серия ›' : '›'}</button>`;
}
// выбрать серию: открыть её сезон в списке и показать плеер (если у серии есть ссылка — сразу она)
function goEp(c) { curEp = c; epEnded = false; epSeason = epNum(c)[0]; eps(); tab(epUrl(c) || curTab === 'link' ? 'link' : 'file'); }
$('#epNow').onclick = ev => { const b = ev.target.closest('button'); if (!b || b.disabled) return; const all = epAll(), n = all[all.indexOf(epCur()) + (+b.dataset.step)]; if (n) goEp(n); };
function ensureItem() { // сериала ещё нет в библиотеке — первая отметка или правка серий добавляет его
  if (!item && info) { item = KP.add(info).item || KP.find(KP.load(), info.title, info.year) || null; if (item) mine(); }
  return item;
}
function setWatched(w) {
  if (!ensureItem()) return;
  KP.update(item.id, KP.epSync(item, w)); item = KP.load().find(x => x.id === item.id) || item; controls();
}
// добавить серии в открытый сезон / убрать последнюю / удалить сезон / добавить новый сезон
function editEps(kind) {
  if (!ensureItem()) return;
  const s = (item.seasons || []).find(x => x.n === epSeason), w = item.w || [];
  if (kind !== 'adds' && !s) return;
  if (kind === 'add') KP.addEps(item.id, s.n, $('#edN').value);
  if (kind === 'del') {
    if (s.c === 1 && !confirm(`В сезоне ${s.n} останется 0 серий, сезон будет удалён. Продолжить?`)) return;
    if (s.c > 1 && w.includes(KP.epCode(s.n, s.c)) && !confirm(`Серия ${s.c} отмечена как просмотренная. Убрать её?`)) return;
    KP.delLastEp(item.id, s.n);
  }
  if (kind === 'dels') {
    const seen = KP.epCodes(s).filter(c => w.includes(c)).length;
    if (!confirm(`Удалить сезон ${s.n} (${s.c} сер.)${seen ? ` вместе с ${seen} отметками просмотра` : ''}?`)) return;
    KP.delSeason(item.id, s.n);
  }
  if (kind === 'adds') {
    const n = +$('#edS').value; if (!(n >= 1)) { $('#edS').focus(); return; }
    KP.addSeason(item.id, n); const S2 = KP.load().find(x => x.id === item.id).seasons; epSeason = S2[S2.length - 1].n; // открываем новый сезон
  }
  edOpen = true; item = KP.load().find(x => x.id === item.id) || item; controls();
  if (isTv() && curEp && !epAll().includes(curEp)) { curEp = ''; tab(curTab); } // серию, которая сейчас в плеере, удалили
}
function eps() {
  if (type !== 'tv' || (!item && !info)) { box.innerHTML = ''; return; }
  const S = (item && item.seasons && item.seasons.length ? item.seasons : info && info.seasons) || [];
  const w = (item && item.w) || [], codes = x => KP.epCodes(x);
  if (!S.some(s => s.n === epSeason)) epSeason = (S.find(s => codes(s).some(c => !w.includes(c))) || S[0] || {}).n || 0; // открываем сезон, где остановились
  const s = S.find(x => x.n === epSeason), tot = KP.epTotal({ seasons: S }), seen = w.length;
  const ed = `<details class="eps-ed-box" ${edOpen || !s ? 'open' : ''}><summary>Добавить или убрать серии</summary>
    ${s ? `<div class="eps-ed"><span>Сезон ${s.n}:</span><input type="number" id="edN" min="1" max="999" value="1" aria-label="Сколько серий добавить"><button type="button" class="b g" data-ed="add">+ серии</button><button type="button" class="b g" data-ed="del">− последняя</button><button type="button" class="b g" data-ed="dels">Удалить сезон</button></div>` : '<p class="rv-none">Сезонов пока нет. Укажите, сколько серий в первом сезоне.</p>'}
    <div class="eps-ed"><span>${s ? 'Новый сезон:' : 'Первый сезон:'}</span><input type="number" id="edS" min="1" max="999" placeholder="серий" aria-label="Сколько серий в новом сезоне"><button type="button" class="b g" data-ed="adds">+ Сезон</button></div></details>`;
  if (!s) { box.innerHTML = `<div class="eps-h"><h2>Сезоны и серии</h2></div>${ed}`; return; }
  const draw = names => {
    const keep = box.dataset.s == s.n ? (box.querySelector('.eps-list') || {}).scrollTop || 0 : 0; box.dataset.s = s.n; // прокрутка списка не сбрасывается при отметке серии
    box.innerHTML = `<div class="eps-h"><h2>Сезоны и серии</h2><span class="sum">Просмотрено ${seen} из ${tot}${item && item.progress ? ' · ' + e(item.progress) : ''}${epNote ? ' · ' + e(epNote) : ''}</span><button class="b" data-next>Отметить следующую серию</button></div>
      <div class="eps-bar"><i style="width:${tot ? Math.min(100, seen / tot * 100) : 0}%"></i></div>
      <div class="chips">${S.map(x => `<button type="button" class="chip ${x.n === s.n ? 'on' : ''}" data-s="${x.n}">Сезон ${x.n} (${codes(x).filter(c => w.includes(c)).length}/${x.c})</button>`).join('')}
        <button type="button" class="chip" data-all>${codes(s).every(c => w.includes(c)) ? 'Снять отметки сезона' : 'Отметить весь сезон'}</button></div>
      <ul class="eps-list">${codes(s).map((c, k) => { const ep = names && names[k] || {}, on = w.includes(c);
        return `<li class="${on ? 'seen' : ''}${c === curEp ? ' cur' : ''}"><label><input type="checkbox" data-c="${c}" ${on ? 'checked' : ''}><b>${k + 1}</b><span>${e(ep.name || 'Серия ' + (k + 1))}<small>${[ep.air_date, ep.runtime ? ep.runtime + ' мин' : ''].filter(Boolean).map(e).join(' · ')}</small></span>${epUrl(c) ? '<i class="lkm" title="Есть сохранённая ссылка">🔗</i>' : ''}</label><button type="button" class="b g ep-play" data-play="${c}" title="Смотреть серию" aria-label="Смотреть серию ${k + 1}">▶</button></li>`; }).join('')}</ul>${ed}`;
    const ul = box.querySelector('.eps-list'); if (ul) ul.scrollTop = keep;
  };
  draw(epCache[s.n]);
  if (tm && !epCache[s.n]) KP.tmdb(`/tv/${tm}/season/${s.n}`).then(d => { epCache[s.n] = d.episodes || []; if (epSeason === s.n && !box.contains(document.activeElement)) draw(epCache[s.n]); bar(); }).catch(() => {}); // без названий список всё равно работает
}
box.addEventListener('toggle', ev => { if (ev.target.classList.contains('eps-ed-box')) edOpen = ev.target.open; }, true); // toggle не всплывает: ловим на погружении
box.onchange = ev => {
  const c = ev.target.dataset.c; if (!c) return;
  const cur = new Set((item && item.w) || []); ev.target.checked ? cur.add(c) : cur.delete(c); setWatched([...cur]);
};
box.onclick = ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.play) { goEp(b.dataset.play); return $('#player').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  if (b.dataset.ed) return editEps(b.dataset.ed);
  const S = (item && item.seasons && item.seasons.length ? item.seasons : info && info.seasons) || [], w = (item && item.w) || [], codes = x => KP.epCodes(x);
  if (b.dataset.s) { epSeason = +b.dataset.s; return eps(); }
  if (b.hasAttribute('data-all')) { const s = S.find(x => x.n === epSeason), cs = codes(s); return setWatched(cs.every(c => w.includes(c)) ? w.filter(c => !cs.includes(c)) : [...new Set([...w, ...cs])]); }
  if (b.hasAttribute('data-next')) {
    for (const s of S) { const c = codes(s).find(c => !w.includes(c)); if (c) { epSeason = s.n; return setWatched([...w, c]); } }
    alert('Все серии уже отмечены');
  }
};
// вкладки плеера
document.querySelector('.tabs').onclick = ev => { const t = ev.target.dataset.tab; if (t) tab(t); };
function tab(t) {
  curTab = t;
  document.querySelectorAll('.tabs .b').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#own').innerHTML = ''; const pl = $('#player'); pl.style.overflow = '';
  const c = isTv() && (t === 'file' || t === 'link') ? epCur() : ''; // у сериала файл и ссылка относятся к серии, у фильма — ко всему фильму
  if (c) curEp = c;
  bar();
  if (t === 'trailer') trailer(pl);
  if (t === 'full') full(pl);
  if (isTv() && (t === 'file' || t === 'link') && !c) { pl.innerHTML = '<div class="empty">В сериале пока нет серий. Добавьте их в блоке «Добавить или убрать серии» выше.</div>'; return; }
  if (t === 'file') {
    $('#own').innerHTML = '<input type="file" id="vf" accept="video/*,.mkv,.avi">';
    $('#vf').onchange = ev => {
      const f = ev.target.files[0]; if (!f) return; const key = 'f:' + f.name + f.size, u = URL.createObjectURL(f);
      if (c) { epFile[c] = { url: u, key, name: f.name }; bar(); }
      video(u, key, c);
    };
    if (c && epFile[c]) video(epFile[c].url, epFile[c].key, c); // файл этой серии уже выбирали на этой странице
    else pl.innerHTML = `<div class="empty">Выберите видеофайл${c ? ' этой серии' : ''} (MP4, WebM, MOV; MKV и AVI зависят от браузера). Файл не загружается на сервер.</div>`;
  }
  if (t === 'link') {
    const saved = c ? epUrl(c) : item && item.source === 'stream' ? item.url : '';
    pl.innerHTML = `<div class="empty">Вставьте прямую ссылку на видео (.mp4, .webm) или адрес встраиваемого плеера вашего сервиса${c ? '. Ссылка сохранится для этой серии' : ''}.</div>`;
    $('#own').innerHTML = `<input id="lu" placeholder="https://…" value="${e(saved)}"><button class="b" id="lb">Открыть</button>${c && saved ? '<button class="b g" id="lx">Убрать ссылку</button>' : ''}`;
    $('#lb').onclick = () => {
      const u = $('#lu').value.trim(); if (!/^https:\/\//.test(u)) { alert('Нужна ссылка, начинающаяся с https://'); return; }
      if (c) {
        if (u !== epUrl(c)) { // сериала может ещё не быть в библиотеке: как и отметка серии, ссылка добавляет его; дату изменения не трогаем (ссылка — не просмотр)
          const had = !!item;
          if (ensureItem()) {
            KP.update(item.id, { eu: { ...(item.eu || {}), [c]: u } }, true); item = KP.load().find(x => x.id === item.id) || item; if (!had) controls(); else eps(); bar();
            if (!$('#lx')) { $('#own').insertAdjacentHTML('beforeend', '<button class="b g" id="lx">Убрать ссылку</button>'); dropLink(); }
          }
        }
      } else if (item) KP.update(item.id, { url: u });
      /\.(mp4|webm|ogg)(\?|$)/i.test(u) ? video(u, 'u:' + u, c) : pl.innerHTML = `<iframe src="${e(u)}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>`;
    };
    const dropLink = () => { if ($('#lx')) $('#lx').onclick = () => { const eu = { ...(item.eu || {}) }; delete eu[c]; KP.update(item.id, { eu }, true); item = KP.load().find(x => x.id === item.id) || item; eps(); tab('link'); }; };
    dropLink();
    if ($('#lu').value) $('#lb').click();
  }
}
const REG = { RU: 'Россия', US: 'США', SE: 'Швеция', DE: 'Германия', GB: 'Великобритания', KZ: 'Казахстан', BY: 'Беларусь' };
async function full(pl) {
  const reg = localStorage.getItem('kp_reg') || 'RU';
  $('#own').innerHTML = (tm ? `<select id="rg" class="b g">${Object.entries(REG).map(([k, v]) => `<option value="${k}" ${k === reg ? 'selected' : ''}>${v}</option>`).join('')}</select>` : '') +
    (info && info.imdb ? `<a class="b g" target="_blank" rel="noopener" href="https://www.imdb.com/title/${e(info.imdb)}/">Страница на IMDb</a>` : '');
  if (tm) $('#rg').onchange = ev => { localStorage.setItem('kp_reg', ev.target.value); full(pl); };
  pl.innerHTML = '<div class="empty">Ищем, где смотреть…</div>';
  let r = null, tmErr = false;
  if (tm) { try { r = (await KP.tmdb(`/${type}/${tm}/watch/providers`, '', 'ru-RU')).results[reg]; } catch (err) { tmErr = true; } }
  await kpP; // данные Кинопоиска могли ещё не успеть прийти
  const mine = KP.mySvc(), kw = (kpi && kpi.watch) || [];
  const grp = [['flatrate', 'По подписке'], ['free', 'Бесплатно'], ['rent', 'Аренда'], ['buy', 'Покупка']].filter(g => r && r[g[0]]);
  const have = new Set(); // сервисы пользователя, где фильм найден (в обоих источниках)
  const mark = n => { const k = KP.svcKey(n); if (k && mine.includes(k)) { have.add(KP.SVC[k][0]); return ' <span class="have">✓ есть у вас</span>'; } return ''; };
  const tmHtml = grp.map(([k, n]) => `<b>${n}:</b> ${r[k].map(p => e(p.provider_name) + mark(p.provider_name)).join(', ')}<br>`).join('') +
    (grp.length ? `<a class="b" style="display:inline-block;margin:10px 0 4px" target="_blank" rel="noopener" href="${e(r.link)}">Открыть и выбрать сервис</a><br><small class="src">Данные TMDB / JustWatch (${e(REG[reg] || reg)})</small>` : '');
  const kpHtml = kw.length ? `<b>На Кинопоиске найдено:</b><div class="wl">${kw.map(w => `<a class="b g" target="_blank" rel="noopener" href="${e(w.url)}">${e(w.name)}</a>${mark(w.name)}`).join('')}</div><small class="src">Данные Кинопоиска</small>` : '';
  const chips = `<div class="svc"><b>Мои подписки:</b> ${Object.entries(KP.SVC).map(([k, v]) => `<button type="button" class="chip ${mine.includes(k) ? 'on' : ''}" data-k="${k}">${v[0]}</button>`).join('')}</div>`;
  const sum = mine.length ? (have.size ? `<div class="okbox">✅ Можно смотреть по вашей подписке: ${[...have].map(e).join(', ')}</div>` : '<div class="nobox">В ваших сервисах этого фильма не нашлось</div>') : '';
  const body = [sum, tmHtml, kpHtml].filter(Boolean).join('<hr>');
  pl.style.overflow = 'auto';
  pl.innerHTML = `<div style="padding:20px;line-height:1.9">${body || `<div class="empty" style="height:auto;padding:10px 0">${tmErr && !kw.length ? 'Не удалось получить список сервисов. Проверьте интернет.' : 'Нет данных о легальных сервисах для этого названия. Смените страну или откройте «Файл» / «Своя ссылка».'}</div>`}
    ${chips}<p style="color:#aaa;font-size:13px;margin-top:10px">Если у вас есть файл или своя ссылка, они открываются во вкладках выше.</p></div>`;
  pl.querySelector('.svc').onclick = ev => { const k = ev.target.dataset.k; if (!k) return; localStorage.setItem('kp_svc', JSON.stringify(mine.includes(k) ? mine.filter(x => x !== k) : [...mine, k])); full(pl); };
}
async function trailer(pl) {
  pl.innerHTML = '<div class="empty">Ищем трейлер…</div>';
  if (!tm) { pl.innerHTML = '<div class="empty">У этой записи нет данных TMDB. Откройте вкладку «Файл» или «Своя ссылка».</div>'; return; }
  try {
    let v = (await KP.tmdb(`/${type}/${tm}/videos`)).results;
    if (!v.some(x => x.site === 'YouTube')) v = (await KP.tmdb(`/${type}/${tm}/videos`, '', 'en-US')).results;
    const y = v.find(x => x.site === 'YouTube' && x.type === 'Trailer') || v.find(x => x.site === 'YouTube');
    pl.innerHTML = y ? `<iframe src="https://www.youtube-nocookie.com/embed/${y.key}" allowfullscreen allow="fullscreen; picture-in-picture"></iframe>` : '<div class="empty">Трейлер не найден. Откройте вкладку «Файл» или «Своя ссылка».</div>';
  } catch (err) { pl.innerHTML = '<div class="empty">Не удалось загрузить трейлер. Проверьте интернет.</div>'; }
}
// HTML5-плеер: запоминает позицию и ставит статус «В процессе» / «Просмотрено»
function video(src, key, ep = '') {
  const pl = $('#player'); pl.innerHTML = '<video controls autoplay playsinline></video>';
  const v = pl.firstChild, k = 'kp_pos_' + key; v.src = src;
  v.onerror = () => pl.innerHTML = '<div class="empty">Браузер не смог воспроизвести этот формат. Попробуйте MP4 (H.264) или WebM.</div>';
  v.onloadedmetadata = () => { const p = +localStorage.getItem(k); if (p > 5 && p < v.duration - 10) v.currentTime = p; };
  let last = 0;
  v.ontimeupdate = () => {
    if (Date.now() - last < 3000) return; last = Date.now(); localStorage.setItem(k, v.currentTime);
    if (item && item.status === 'plan') { KP.update(item.id, { status: 'progress' }); item.status = 'progress'; controls(); }
  };
  v.onended = () => {
    localStorage.removeItem(k);
    if (ep) { epEnded = true; setWatched([...new Set([...((item && item.w) || []), ep])]); bar(); return; } // серия досмотрена: отметка, статус и прогресс пересчитываются сами
    if (item) { KP.update(item.id, { status: 'done' }); item.status = 'done'; controls(); }
  };
}
